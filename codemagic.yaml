workflows:
  android-trial-apk:
    name: Dream Squad Fingerprint Check
    max_build_duration: 60

    environment:
      flutter: stable
      android_signing:
        - agecalculator_upload

    scripts:
      - name: Prepare Android platform
        script: |
          chmod +x tool/bootstrap_android.sh
          ./tool/bootstrap_android.sh

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Show signing fingerprints
        script: |
          echo "=== SHA FINGERPRINTS ==="
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS" \
            -keypass "$CM_KEY_PASSWORD"

      - name: Build release APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
