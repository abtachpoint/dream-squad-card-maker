workflows:
  android-final-build:
    name: Dream Squad Clean Final Build
    max_build_duration: 60

    environment:
      flutter: stable
      android_signing:
        - agecalculator_upload

    scripts:
      - name: Prepare clean Android API 36 project
        script: |
          chmod +x tool/prepare_android.sh
          ./tool/prepare_android.sh
          grep -n "compileSdk = 36\|targetSdk = 36\|minSdk = 24" android/app/build.gradle.kts

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate final app icon and splash
        script: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Analyze project
        script: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build final APK with test ads
        script: |
          flutter build apk --release --dart-define=USE_TEST_ADS=true

      - name: Build final AAB with live ads
        script: |
          flutter build appbundle --release --dart-define=USE_TEST_ADS=false

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
